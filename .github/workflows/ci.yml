name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint del generador
        run: pipx run ruff check scripts tests

      - name: Pruebas
        run: python -m unittest discover -s tests

      - name: La gráfica pública de contribuciones se puede leer
        run: python scripts/fetch_github.py --check

      - name: Regenerar SVG desde content/profile.toml
        run: python scripts/build_assets.py

      - name: Los SVG versionados coinciden con el contenido
        run: git diff --exit-code -- assets/

      - name: SVG bien formados
        run: |
          sudo apt-get install -y --no-install-recommends libxml2-utils >/dev/null
          find assets -name '*.svg' -print0 | xargs -0 xmllint --noout

      - name: Recursos del README
        run: python scripts/check_readme.py
