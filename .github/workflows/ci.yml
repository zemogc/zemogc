name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Lint del generador
        run: pipx run ruff==0.16.8 check scripts tests

      - name: Pruebas
        run: python -m unittest discover -s tests

      - name: La gráfica pública de contribuciones se puede leer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_github.py --check

      - name: Regenerar SVG desde content/profile.toml
        run: python scripts/build_assets.py

      - name: Los SVG versionados coinciden con el contenido
        run: |
          git diff --exit-code -- assets/
          test -z "$(git status --porcelain -- assets/)" || { git status --short -- assets/; exit 1; }

      - name: SVG bien formados
        run: |
          sudo apt-get install -y --no-install-recommends libxml2-utils >/dev/null
          find assets -name '*.svg' -print0 | xargs -0 xmllint --noout

      - name: Recursos del README
        run: python scripts/check_readme.py
