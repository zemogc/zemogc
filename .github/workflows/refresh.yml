name: refresh

# Trae la actividad real de GitHub y regenera los SVG.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - content/**
      - scripts/**
      - .github/workflows/refresh.yml

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Lee la gráfica pública del perfil, que ya incluye las contribuciones privadas.
      - name: Descargar actividad
        run: python scripts/fetch_github.py

      - name: Regenerar SVG
        run: python scripts/build_assets.py

      - name: Publicar cambios
        run: |
          git add data assets
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(live): actualizar actividad de GitHub"
          git push
